<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section{
            background-color: grey;
            height:100vh;
        }
        section>div{
            border:2px solid black;
            color:white;
            padding:40px;
            margin: 20px ;
            width:150px;
            position:relative;
        }
        .container{
            padding:20px;
        }
        .b1{
            left:100px;
        }
        .b2{
            right:100px;
        }
        .b3{
            top:100px;
        }
        .b4{
            bottom:100px;
        }
    </style>
</head>
<body>
    <center>
        <h1>RELATIVE POSITION</h1>
    </center>
    <hr>
    <section class="container">
        <div class="b1">
            <p>PROPERTY_LEFT</p>
        </div>
        <div class="b2">
            <p>PROPERTY_RIGHT</p>
        </div>
        <div class="b3">
            <p>PROPERTY_TOP</p>
        </div>
        <div class="b4">
            <p>PROPERTY_BOTTOM</p>
        </div>
    </section>
</body>
</html>
