<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        .container{
            background-color: grey;
            padding:20px;
        }
        .container>div{
            border: 2px solid black;
            color:white;
            margin-bottom:20px;
            padding:20px;
            text-align: center;
            position:relative;/*with respect to parent we have to set the child b4,b2 within the parent there will be border created within that we have to adjust*/
        }
        .b2{
            position:absolute;
            background-color: bisque;
            top:0px;
            right:0px;
        
        }
        .b4{
            position:absolute;
            background-color: rgb(187, 27, 123);
            top:0px;
            left:0px;
           
        }
      
        .b1{
            position:relative;
            background-color: aquamarine;
        }
        .b3{
            position:relative;
            background-color: brown;
        }
     
    </style>
    <center>
        <h1>ABSOLUTE AND RELATIVE POSITION</h1>
    </center>
    <hr>
    <section class="container">
        <div>
            <p class="b1">BOX-1</p>
            <p class="b2">BOX-2</p>
            <p class="b3">BOX-3</p>
            <p class="b4">BOX-4</p>
        </div>

    </section>
</body>
</html>
