<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background:linear-gradient(blueviolet,orangered);
            background-repeat: no-repeat;
            height:90vh;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif
        }
        .container{
            display:flex;
            justify-content: center;
           
          
        }
        .card{
            background-color: white;
            width:40px;
            padding:280px;
            margin-top: 100px;
            
        }
        img{
            padding-top:20px;
            position:absolute;
            top:70px;
            left:460px;
            box-shadow:3px 7px  10px blueviolet;
        }
        .card>div{/*Parent is set as position relative there will be border created within that we can set the absolute property*/
            text-align:center;
            position: relative;
        }
        h5{
            position:absolute;/*for child elements position absolute*/
            top:-240px;
            right:-20px;
            color: blueviolet;
            
        }
        h6{
            position: absolute;
            top:-210px;
            right:-70px;
            color:green;
        }
        p{
            position: absolute;
            top:-180px;
            left:-10px;
            color:black;
        }
        .blast{
            display:flex;
            position:relative;
          
        }

        #flo{
            margin:20px;
            position:absolute;
            top:180px;
            left:40px;
            padding:10px;
            width:160px;
            border-radius: 20px;
            background-color: red;
            color:white;
        }
        #msg{
            margin:20px;
            position:absolute;
            top:180px;
            left:-170px;
            padding:10px;
            width:160px;
            border-radius: 20px;
            background:linear-gradient( white,rgb(13, 13, 231));
            color:white;
            box-shadow: 3px 4px 10px blue;;
        }
        #logos{
            display:flex;
            position:relative;/*for parent apply relative*/
            justify-content: center;
        }
        #f{
            /* position:absolute;/*for childs absolute*/
            top:-0.px;
            left:-250px;
            width:60px;
            border-radius: 70px;
            padding: 0px;
            box-shadow: 3px 4px 10px 1px blue; */
        }
        
        #t{
            position:absolute;
            top:-0.px;
            left:-170px;
            width:60px;
            border-radius: 70px;
            padding: 0px;
            box-shadow: 3px 4px 10px 1px blue;
            
        }
        #i{
            position:absolute;
            top:-0.px;
            left:-90px;
            width:60px;
            border-radius: 70px;
            padding: 0px;
            box-shadow: 3px 4px 10px 1px blue;
            margin-left:6px;
           
        }
        #v{
            position:absolute;
            top:-0.px;
            left:-20px;
            width:60px;
            border-radius: 70px;
            padding: 0px;
            box-shadow: 3px 4px 10px 1px blue;
            margin-left:12px; 
            
        }
        #g{
            position:absolute;
            top:-0.px;
            left:-0px;
            width:60px;
            border-radius: 70px;
            padding: 0px;
            box-shadow: 3px 4px 10px 1px blue;
            
        }
        #s{
            position:absolute;
            top:-0.px;
            left:-250px;
            width:60px;
            border-radius: 70px;
            padding: 0px;
            box-shadow: 3px 4px 10px 1px blue;
            
        }
    
        #c{
            position:absolute;
            top:-0.px;
            width:60px;
            border-radius: 70px;
            padding: 0px;
            box-shadow: 3px 4px 10px 1px blue;
            
        }
    </style>
</head>
<body>
    <center>
    <img src=".//IMAGES/camera.png" alt="">
    </center>
    <div class="container">
        <div class="card">
        <div>
        <h5>Muhammed&nbsp;&nbsp&nbspErden</h5>

            <img id="c"src="./IMAGES/chain.png" alt="">
            <img id="v"src="./IMAGES/video-camera.png" alt="">
        </div>
    </div>
           <div class="blast">

            <button id="flo">Follow</button>
           </div>
    </div>

</html>
